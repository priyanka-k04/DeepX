<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepX - Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<script>
    // 1. AUTH GUARD: Immediately check if a user is logged in
    // This checks for 'deepx_user' which we will save during login
    if (!localStorage.getItem('deepx_user')) {
        window.location.href = 'login.html';
    }
</script>

<body class="bg-gradient-to-br from-[#f0f9ff] to-[#e0f2fe] text-gray-800 h-screen overflow-hidden m-0 p-0">
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-[#3F51C1]/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full max-w-4xl max-h-4xl bg-white/40 rounded-full blur-3xl">
        </div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-[#3F51C1]/20 rounded-full blur-3xl"></div>
    </div>

    <div class="flex h-screen relative z-10">
        <div class="w-72 bg-white/70 backdrop-blur-xl border-r border-white/50 pt-9 flex flex-col justify-between shadow-lg">
            <div>
                <div class="text-5xl font-bold text-[#3F51C1] px-8 mb-12">DeepX</div>
                <div class="flex flex-col gap-2">
                    <a href="/"
                    onclick="localStorage.removeItem('last_prediction'); localStorage.removeItem('last_confidence'); localStorage.removeItem('last_heatmap');"
                    class="px-8 py-3.5 text-gray-500 no-underline block transition-all text-base hover:bg-[#3F51C1]/10 hover:text-[#3F51C1]">
                        <i class="fa-solid fa-house mr-3 w-5"></i> Home
                    </a>
                    <a href="/upload/" 
                    onclick="localStorage.removeItem('last_prediction'); localStorage.removeItem('last_confidence'); localStorage.removeItem('last_heatmap');"
                    class="px-8 py-3.5 text-[#3F51C1] block transition-all text-base bg-[#3F51C1]/10 border-r-4 border-[#3F51C1] font-medium">
                        <i class="fa-solid fa-cloud-arrow-up mr-3 w-5"></i> Upload
                    </a>
                    <a href="/results/" class="px-8 py-3.5 text-gray-500 block hover:bg-[#3F51C1]/10 hover:text-[#3F51C1] transition-all flex items-center">
                        <i class="fa-solid fa-chart-pie mr-3 w-5"></i> 
                         Results 
                         <span id="newResultBadge" class="hidden ml-2 px-2 py-0.5 bg-red-500 text-white text-[10px] rounded-full animate-pulse">NEW</span>
                    </a>
                    <a href="/history/" class="px-8 py-3.5 text-gray-500 block hover:bg-[#3F51C1]/10 hover:text-[#3F51C1] transition-all flex items-center">
                        <i class="fa-solid fa-clock-rotate-left mr-3 w-5"></i> History
                    </a>
                </div>
            </div>

            <div class="p-6 border-t border-white/50 bg-white/30 backdrop-blur-sm">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-[#3F51C1] flex items-center justify-center text-white text-lg font-bold shadow-md">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-sm font-bold text-gray-800 truncate" id="userNameDisplay">Guest Analyst</div>
                        <div class="text-xs text-gray-500 truncate">Deepfake Researcher</div>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 hover:text-red-600 transition-all text-sm font-medium group">
                    <i class="fa-solid fa-right-from-bracket group-hover:scale-110 transition-transform"></i> Logout
                </button>
            </div>
        </div>

        <div class="flex-1 p-12 overflow-y-auto">
            <h1 class="text-5xl font-bold mb-4 text-gray-800">Upload Content</h1>
            <p class="text-gray-500 mb-12 text-lg">Select media to analyze for deepfakes</p>

            <div class="mb-10">
                <label class="block text-gray-700 mb-3 text-sm font-semibold uppercase tracking-wider">Content Type</label>
                <div class="relative w-72">
                    <select id="contentType" class="w-full px-4.5 py-3.5 pl-10 bg-white/90 border-2 border-[#3F51C1]/30 shadow-md rounded-xl text-gray-800 text-base cursor-pointer outline-none appearance-none focus:border-[#50c6d8] focus:ring-2 focus:ring-[#50c6d8]/30 transition-all hover:border-[#50c6d8]/60 font-medium">
                        <option value="image">Image</option>
                        <option value="video">Video</option>
                        <option value="audio">Audio</option>
                    </select>
                    <i class="fa-solid fa-photo-film absolute left-3.5 top-1/2 -translate-y-1/2 text-[#3F51C1]/70 pointer-events-none"></i>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-[#3F51C1]/70 text-xs pointer-events-none"></i>
                </div>
            </div>

            <div class="max-w-3xl border-2 border-dashed border-[#3F51C1]/30 bg-white/40 rounded-2xl p-16 text-center cursor-pointer mb-12 transition-all hover:border-[#50c6d8] hover:bg-white/60 hover:shadow-xl hover:scale-[1.01] group backdrop-blur-sm"
                id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="text-[#3F51C1]/50 mb-6 flex justify-center group-hover:text-[#3F51C1] group-hover:scale-110 transition-all duration-300">
                    <i class="fa-solid fa-cloud-arrow-up text-7xl"></i>
                </div>
                <div class="text-2xl text-gray-700 mb-2 font-medium">Drag & drop your file here</div>
                <div class="text-gray-400 mb-8 text-sm">Supports all major formats</div>

                <button type="button"
                    class="px-8 py-3 bg-[#3F51C1] text-white rounded-full text-base font-semibold cursor-pointer transition-all hover:bg-[#3db8ca] hover:shadow-lg hover:-translate-y-0.5"
                    onclick="event.stopPropagation(); document.getElementById('fileInput').click();">
                    Browse Files
                </button>
            </div>

            <input type="file" id="fileInput" accept="image/*,video/*,audio/*" onchange="handleFileSelect(event)" class="hidden">

            <div class="max-w-3xl mb-8 p-4 bg-white/80 rounded-xl border border-white/60 shadow-lg hidden backdrop-blur-md" id="filePreview">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-[#3F51C1]/10 rounded-lg flex items-center justify-center text-[#3F51C1] text-xl">
                        <i class="fa-regular fa-file-image"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-gray-800 font-semibold text-lg" id="fileName"></div>
                        <div class="text-gray-500 text-xs uppercase tracking-wide" id="fileSize"></div>
                    </div>
                    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500 transition-all text-lg" onclick="removeFile()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <button class="px-10 py-4 bg-gray-200 text-gray-400 rounded-xl text-lg font-bold cursor-not-allowed transition-all shadow-none w-full max-w-md"
                id="detectBtn" onclick="startDetection()" disabled>
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Start Detection
            </button>
        </div>
    </div>

<script>
    // 1. DYNAMIC USER DISPLAY
    document.addEventListener('DOMContentLoaded', () => {
        // Pull the name saved during the login process
        const savedName = localStorage.getItem('deepx_user');
        if (savedName) {
            document.getElementById('userNameDisplay').textContent = savedName;
        }
    });

    let selectedFile = null;
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');

    // 2. Drag and Drop Logic
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('border-[#50c6d8]', 'bg-white/80');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('border-[#50c6d8]', 'bg-white/80');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('border-[#50c6d8]', 'bg-white/80');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) handleFile(file);
    }

    function handleFile(file) {
        selectedFile = file;
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatFileSize(file.size);
        document.getElementById('filePreview').classList.remove('hidden');

        const btn = document.getElementById('detectBtn');
        btn.disabled = false;
        btn.classList.remove('bg-gray-200', 'text-gray-400', 'cursor-not-allowed', 'shadow-none');
        btn.classList.add('bg-gradient-to-r', 'from-[#50c6d8]', 'to-[#3db8ca]', 'text-white', 'cursor-pointer', 'shadow-xl', 'hover:shadow-2xl', 'hover:-translate-y-1');
    }

    async function startDetection() {
    // 1. FILE RECOVERY: Look directly at the Input Element first
    const fileInput = document.getElementById('fileInput');
    let file = null;

    if (fileInput && fileInput.files.length > 0) {
        file = fileInput.files[0]; 
    } else if (typeof selectedFile !== 'undefined' && selectedFile) {
        file = selectedFile; 
    }

    if (!file) {
        alert("No file detected. Please click 'Browse Files' or drag an image here.");
        return;
    }

    // 2. UI SETUP - Loading State
    const btn = document.getElementById('detectBtn');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Analyzing...';
    }
    
    // 3. DYNAMIC ENDPOINT (Smart Media Detection)
    const contentTypeEl = document.getElementById('contentType');
    let mediaType = contentTypeEl ? contentTypeEl.value.toLowerCase() : 'video';

// OVERRIDE: If the actual file is audio, force mediaType to 'audio'
    if (file && file.type.includes('audio')) {
        mediaType = 'audio';
    }
    const endpoint = `/api/detect-${mediaType}/`; 

    const formData = new FormData();
    formData.append('file', file);

    console.log(`DeepX: Starting ${mediaType} analysis... File:`, file.name);

   try {
        const response = await fetch(endpoint, { 
            method: 'POST', 
            body: formData,
            redirect: 'follow' 
        });

        // 1. If Django sent a physical redirect command
        if (response.redirected) {
            console.log("DeepX: Handshake Successful. Redirecting via response.url...");
            window.location.href = response.url;
            return;
        }

        // 2. If Django sent data back as JSON
        const data = await response.json();
        console.log("DeepX Backend Response:", data);

        if (data.redirect_url) {
            window.location.href = data.redirect_url;
        } else if (data.status === 'success' || data.prediction) {
            
            // 🚨 CRITICAL HANDSHAKE FIX: Save it to storage before flipping pages
            localStorage.setItem('last_prediction', data.prediction);
            localStorage.setItem('last_confidence', data.confidence);
            localStorage.setItem('last_heatmap', data.heatmap_url || '');
            localStorage.setItem('last_media_type', mediaType);

            // Build URL with a timestamp 't' to force the browser to dump old cache
            const query = new URLSearchParams({
                prediction: data.prediction,
                confidence: data.confidence,
                media_type: mediaType,
                heatmap_url: data.heatmap_url || '',
                t: Date.now() 
            }).toString();

            console.log("DeepX: Moving to results with query parameters.");
            window.location.href = `/results/?${query}`;
        }

    } catch (error) {
        console.error("DeepX Connection Error:", error);
        
        // 🚨 EMERGENCY FAIL-SAFE:
        // If the pipe breaks but the backend actually finished, we push the user 
        // to results.html anyway so they aren't stuck looking at a frozen button!
        console.warn("DeepX: Pipe broken or network lagged. Forcing jump to results...");
        setTimeout(() => {
             window.location.href = "/results/?status=check_history";
        }, 1500);
    }    
    }
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function removeFile() {
        selectedFile = null;
        fileInput.value = '';
        const preview = document.getElementById('filePreview');
        if (preview) preview.classList.add('hidden');
        
        const btn = document.getElementById('detectBtn');
        btn.disabled = true;
        btn.classList.add('bg-gray-200', 'text-gray-400', 'cursor-not-allowed', 'shadow-none');
        btn.classList.remove('bg-gradient-to-r', 'from-[#50c6d8]', 'to-[#3db8ca]', 'text-white', 'cursor-pointer', 'shadow-xl', 'hover:shadow-2xl', 'hover:-translate-y-1');
    }

    // 4. LOGOUT HANDLER
    function handleLogout() {
        localStorage.removeItem('deepx_user');
        window.location.href = '/login/';
    }
    
</script>
</body>
</html>
