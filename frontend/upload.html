<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepX - Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<script>
    if (!localStorage.getItem('currentUser')) {
        window.location.href = 'login.html';
    }
</script>

<body class="bg-gradient-to-br from-[#f0f9ff] to-[#e0f2fe] text-gray-800 h-screen overflow-hidden m-0 p-0">
    <!-- Background Decorators -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-[#3F51C1]/20 rounded-full blur-3xl"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full max-w-4xl max-h-4xl bg-white/40 rounded-full blur-3xl">
        </div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-[#3F51C1]/20 rounded-full blur-3xl"></div>
    </div>

    <div class="flex h-screen relative z-10">
        <!-- Sidebar -->
        <div
            class="w-72 bg-white/70 backdrop-blur-xl border-r border-white/50 pt-9 flex flex-col justify-between shadow-lg">
            <div>
                <div class="text-5xl font-bold text-[#3F51C1] px-8 mb-12">DeepX</div>
                <div class="flex flex-col gap-2">
                    <a href="index.html"
                        class="px-8 py-3.5 text-gray-500 no-underline block transition-all text-base hover:bg-[#3F51C1]/10 hover:text-[#3F51C1]">
                        <i class="fa-solid fa-house mr-3 w-5"></i> Home
                    </a>
                    <a href="upload.html"
                        class="px-8 py-3.5 text-[#3F51C1] block transition-all text-base bg-[#3F51C1]/10 border-r-4 border-[#3F51C1] font-medium">
                        <i class="fa-solid fa-cloud-arrow-up mr-3 w-5"></i> Upload
                    </a>
                    <a href="#"
                        class="px-8 py-3.5 text-gray-500 no-underline block transition-all text-base hover:bg-[#3F51C1]/10 hover:text-[#3F51C1]">
                        <i class="fa-solid fa-chart-pie mr-3 w-5"></i> Results
                    </a>
                    <a href="#"
                        class="px-8 py-3.5 text-gray-400 no-underline block transition-all text-base cursor-not-allowed">
                        <i class="fa-solid fa-clock-rotate-left mr-3 w-5"></i> History
                    </a>
                </div>
            </div>

            <!-- User Profile & Logout -->
            <div class="p-6 border-t border-white/50 bg-white/30 backdrop-blur-sm">
                <div class="flex items-center gap-3 mb-4">
                    <div
                        class="w-10 h-10 rounded-full bg-[#3F51C1] flex items-center justify-center text-white text-lg font-bold shadow-md">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-sm font-bold text-gray-800 truncate" id="userNameDisplay">User</div>
                        <div class="text-xs text-gray-500 truncate">Deepfake Analyst</div>
                    </div>
                </div>
                <button onclick="handleLogout()"
                    class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 hover:text-red-600 transition-all text-sm font-medium group">
                    <i class="fa-solid fa-right-from-bracket group-hover:scale-110 transition-transform"></i> Logout
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-12 overflow-y-auto">
            <h1 class="text-5xl font-bold mb-4 text-gray-800">Upload Content</h1>
            <p class="text-gray-500 mb-12 text-lg">Select media to analyze for deepfakes</p>

            <div class="mb-10">
                <label class="block text-gray-700 mb-3 text-sm font-semibold uppercase tracking-wider">Content
                    Type</label>
                <div class="relative w-72">
                    <select
                        class="w-full px-4.5 py-3.5 pl-10 bg-white/90 border-2 border-[#3F51C1]/30 shadow-md rounded-xl text-gray-800 text-base cursor-pointer outline-none appearance-none focus:border-[#50c6d8] focus:ring-2 focus:ring-[#50c6d8]/30 transition-all hover:border-[#50c6d8]/60 font-medium">
                        <option class="bg-white text-gray-800 font-medium py-2">Image</option>
                        <option class="bg-white text-gray-800 font-medium py-2">Video</option>
                        <option class="bg-white text-gray-800 font-medium py-2">Audio</option>
                    </select>
                    <i class="fa-solid fa-photo-film absolute left-3.5 top-1/2 -translate-y-1/2 text-[#3F51C1]/70 pointer-events-none"></i>
                    <i
                        class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-[#3F51C1]/70 text-xs pointer-events-none"></i>
                </div>
            </div>

            <div class="max-w-3xl border-2 border-dashed border-[#3F51C1]/30 bg-white/40 rounded-2xl p-16 text-center cursor-pointer mb-12 transition-all hover:border-[#50c6d8] hover:bg-white/60 hover:shadow-xl hover:scale-[1.01] group backdrop-blur-sm"
                id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div
                    class="text-[#3F51C1]/50 mb-6 flex justify-center group-hover:text-[#3F51C1] group-hover:scale-110 transition-all duration-300">
                    <i class="fa-solid fa-cloud-arrow-up text-7xl"></i>
                </div>
                <div class="text-2xl text-gray-700 mb-2 font-medium">Drag & drop your file here</div>
                <div class="text-gray-400 mb-8 text-sm">Supports all major formats</div>

                <button
                    class="px-8 py-3 bg-[#3F51C1] text-white rounded-full text-base font-semibold cursor-pointer transition-all hover:bg-[#3db8ca] hover:shadow-lg hover:-translate-y-0.5"
                    onclick="event.stopPropagation()">
                    Browse Files
                </button>
                <div class="text-gray-400 text-xs mt-6">Supported formats: .jpg, .jpeg, .png, .gif, .mp4, .avi</div>
            </div>

            <input type="file" id="fileInput" accept="image/*,video/*,audio/*" onchange="handleFileSelect(event)"
                class="hidden">

            <div class="max-w-3xl mb-8 p-4 bg-white/80 rounded-xl border border-white/60 shadow-lg hidden backdrop-blur-md"
                id="filePreview">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 bg-[#3F51C1]/10 rounded-lg flex items-center justify-center text-[#3F51C1] text-xl">
                        <i class="fa-regular fa-file-image"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-gray-800 font-semibold text-lg" id="fileName"></div>
                        <div class="text-gray-500 text-xs uppercase tracking-wide" id="fileSize"></div>
                    </div>
                    <button
                        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500 transition-all text-lg"
                        onclick="removeFile()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <button
                class="px-10 py-4 bg-gray-200 text-gray-400 rounded-xl text-lg font-bold cursor-not-allowed transition-all shadow-none w-full max-w-md"
                id="detectBtn" onclick="startDetection()" disabled>
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Start Detection
            </button>
        </div>
    </div>

    <script>
        // Load User Info
        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('currentUser');
            if (userJson) {
                const user = JSON.parse(userJson);
                const nameDisplay = document.getElementById('userNameDisplay');
                if (nameDisplay && user.fullName) {
                    nameDisplay.textContent = user.fullName;
                }
            }
        });

        let selectedFile = null;
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-[#50c6d8]', 'bg-white/80');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-[#50c6d8]', 'bg-white/80');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-[#50c6d8]', 'bg-white/80');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) handleFile(file);
        }

        function handleFile(file) {
            // Updated to allow all types for demo purposes or restrict if needed
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('filePreview').classList.remove('hidden');

            const btn = document.getElementById('detectBtn');
            btn.disabled = false;
            btn.classList.remove('bg-gray-200', 'text-gray-400', 'cursor-not-allowed', 'shadow-none');
            btn.classList.add('bg-gradient-to-r', 'from-[#50c6d8]', 'to-[#3db8ca]', 'text-white', 'cursor-pointer', 'shadow-xl', 'hover:shadow-2xl', 'hover:-translate-y-1');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.add('hidden');

            const btn = document.getElementById('detectBtn');
            btn.disabled = true;
            btn.classList.add('bg-gray-200', 'text-gray-400', 'cursor-not-allowed', 'shadow-none');
            btn.classList.remove('bg-gradient-to-r', 'from-[#50c6d8]', 'to-[#3db8ca]', 'text-white', 'cursor-pointer', 'shadow-xl', 'hover:shadow-2xl', 'hover:-translate-y-1');
        }

        function startDetection() {
            if (!selectedFile) return;
            alert('Starting deepfake detection analysis on: ' + selectedFile.name);
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
